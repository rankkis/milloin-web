name: E2E

# Vercel reports each finished deployment (every pull request preview and
# production) to GitHub as a deployment status; this runs the end-to-end
# tests against its URL.
on:
  deployment_status:

jobs:
  e2e:
    if: github.event.deployment_status.state == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.deployment.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Check that the tests can reach the deployment
        env:
          BASE_URL: ${{ github.event.deployment_status.environment_url || github.event.deployment_status.target_url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          # A protected deployment answers with Vercel's login page (401, or a redirect to it)
          status=$(curl -s -o page.html -w '%{http_code}' -H "x-vercel-protection-bypass: $VERCEL_AUTOMATION_BYPASS_SECRET" "$BASE_URL/")
          if [ "$status" != 200 ] || grep -q 'Log in to Vercel' page.html; then
            echo "::error::The deployment answered $status instead of the site, probably Vercel Deployment Protection. Add the VERCEL_AUTOMATION_BYPASS_SECRET repository secret from Vercel: Settings, Deployment Protection, Protection Bypass for Automation."
            exit 1
          fi
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
        env:
          BASE_URL: ${{ github.event.deployment_status.environment_url || github.event.deployment_status.target_url }}
          # Only needed while Vercel Deployment Protection is on for previews
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
