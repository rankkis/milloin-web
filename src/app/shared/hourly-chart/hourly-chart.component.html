<div class="bars" role="img" [attr.aria-label]="summary()">
  @for (bar of bars(); track $index) {
    <div [class]="'bar bar--' + bar.state" [style.height]="bar.height"></div>
  }
</div>
<div class="axis" aria-hidden="true">
  @for (label of axisLabels(); track $index) {
    <span>{{ label }}</span>
  }
</div>
